name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Determine version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          $tag = $env:REF_NAME
          if ($tag -match '^v(.+)$') { $version = $Matches[1] }
          elseif ($env:INPUT_VERSION -ne '') { $version = $env:INPUT_VERSION }
          else { $version = '0.0.0-' + $env:SHA.Substring(0, 7) }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version: $version"

      - name: Build release ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build/pack-zip.ps1 -Version $env:VERSION

      - name: Take the release body from RELEASE_NOTES.md
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Same range CLAUDE.md uses for the tag message: from this version's
          # "# VibeSuperTonic v<X>" heading to the next "---" line.
          $lines = Get-Content RELEASE_NOTES.md
          $head = "# VibeSuperTonic v$($env:VERSION)"
          $start = [Array]::IndexOf($lines, $head)
          if ($start -lt 0) { throw "RELEASE_NOTES.md has no section '$head'" }
          $out = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            $out += $lines[$i]
            if ($lines[$i] -eq '---') { break }
          }
          $out | Set-Content -Path release-body.md -Encoding utf8

      - name: Locate ZIP
        id: zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          "path=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($zip.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VibeSuperTonic ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          body_path: release-body.md
          files: ${{ steps.zip.outputs.path }}
