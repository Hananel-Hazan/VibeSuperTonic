name: build

on:
  push:
    # Dev is where the Linux port is being built (docs/LINUX-PORT-PLAN.md), and
    # the plan's own gate for the second isolation step is "Core.Tests green on
    # Windows and on Linux, in CI, not locally". With main-only triggers that
    # gate could never be reached from the branch the work actually happens on —
    # every commit below would land on main already unverified.
    branches: [main, Dev]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, Dev]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- Windows
  # Produces the shippable ZIP. Also the only job that can catch a regression in
  # the 32-bit engine, which is the half of the product with no local coverage —
  # nobody runs a 32-bit SAPI host by accident.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # Core is platform-neutral, but "runs on Linux" is not evidence that it
      # runs on Windows — line endings, path separators, string comparison and
      # culture all differ, and the text/offset code this suite covers touches
      # the first three. The isolation gate in docs/LINUX-PORT-PLAN.md requires
      # this suite green on BOTH runners; the Linux job alone only half-satisfies
      # it. Placed before the publishes so a Core regression fails in seconds
      # rather than after two RID publishes and a ZIP.
      - name: Test platform-neutral code
        run: dotnet test src/VibeSuperTonic.Core.Tests/VibeSuperTonic.Core.Tests.csproj -c Release --nologo

      - name: Restore + build engine (x64)
        run: dotnet publish src/VibeSuperTonic.Engine/VibeSuperTonic.Engine.csproj -c Release -r win-x64 --no-self-contained --nologo

      - name: Restore + build engine (x86)
        run: dotnet publish src/VibeSuperTonic.Engine/VibeSuperTonic.Engine.csproj -c Release -r win-x86 --no-self-contained --nologo

      # The ORT 1.22.1 pin in VibeSuperTonic.Engine.csproj is load-bearing: 1.23.0
      # dropped the win-x86 native from the package, and the failure is silent —
      # publish succeeds, the x86 folder gets DirectML.dll but no onnxruntime.dll,
      # and the engine dies with DllNotFoundException on first Speak inside a
      # 32-bit host. The csproj says so in a comment; this step is what enforces
      # it. Most likely future cause of a bump: the Linux port, which needs the
      # CPU package and has no reason to care about win-x86.
      - name: Assert win-x86 ONNX Runtime native survived the publish
        shell: pwsh
        run: |
          $pub = "src/VibeSuperTonic.Engine/bin/Release/net10.0-windows/win-x86/publish"
          $dll = Get-ChildItem $pub -Recurse -Filter onnxruntime.dll -ErrorAction SilentlyContinue
          if (-not $dll) {
            Get-ChildItem $pub -Recurse | Select-Object -ExpandProperty Name | Sort-Object
            throw "win-x86 publish contains no onnxruntime.dll. ORT was probably bumped past 1.22.1 — read the pin comment in src/VibeSuperTonic.Engine/VibeSuperTonic.Engine.csproj before changing that version."
          }
          Write-Host "OK: $($dll[0].FullName) ($([math]::Round($dll[0].Length/1MB,1)) MB)"

      - name: Restore + build launcher (x64 single-file)
        run: dotnet publish src/VibeSuperTonic.Launcher/VibeSuperTonic.Launcher.csproj -c Release -r win-x64 --nologo

      - name: Compose release ZIP
        run: ./build/pack-zip.ps1 -Version "ci-${{ github.sha }}"
        shell: pwsh

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeSuperTonic-ci-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14

  # ------------------------------------------------------------------ Linux
  # Builds the platform-neutral half of the tree (docs/LINUX-PORT-PLAN.md).
  # Exists so the two platforms guard each other: without it, a Windows-motivated
  # change to shared code breaks Linux and nobody finds out until someone next
  # opens the Mint box, and the Windows job above cannot see a net10.0 project
  # regress because it never builds one on a machine where Windows types are
  # absent.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build Linux solution
        run: dotnet build VibeSuperTonic.linux.slnx -c Release --nologo

      # Was guarded on the directory existing, so it would activate by itself
      # when Phase 1 landed Core.Tests. It has: the guard is now permanently true
      # and only obscures a failure to restore.
      - name: Test platform-neutral code
        run: >
          dotnet test VibeSuperTonic.linux.slnx -c Release --nologo
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # WHY THIS EXISTS. A failing test step reports "Process completed with exit
      # code 1" and nothing else to anyone without admin rights on the repository
      # — the job log needs them, and the check-run annotations carry only that
      # one line. The step summary does NOT: it comes back in the check-run's
      # `output.summary`, readable by anybody. So the names of the failing tests
      # go there, and a red run becomes diagnosable from outside.
      - name: Which tests failed
        if: failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          print("## Failing tests\n")
          found = False
          for f in glob.glob("TestResults/**/*.trx", recursive=True):
              for r in ET.parse(f).getroot().iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") != "Failed":
                      continue
                  found = True
                  print(f"### {r.get('testName')}\n")
                  msg = r.find(".//t:Message", ns)
                  tr = r.find(".//t:StackTrace", ns)
                  print("```")
                  if msg is not None and msg.text: print(msg.text.strip()[:1500])
                  if tr is not None and tr.text: print(tr.text.strip()[:1500])
                  print("```\n")
          if not found:
              print("No failed test was recorded — the step failed before or "
                    "outside the test run. Check the build output.")
          PY

      # PublishAot only takes effect on `dotnet publish`, so the step above
      # compiles vst-ctl without ever exercising the native toolchain — and the
      # plan (Phase 7) names the release run as the first place this can fail.
      # That is the same shape as the win-x86 ONNX pin: a build that succeeds
      # while producing something that does not work.
      #
      # It fails in two directions and both matter. Without clang and the
      # platform headers the publish errors out, which is the toolchain answer
      # Phase 7 needs before it starts rather than during. And a publish that
      # silently falls back to a managed binary ships a client that starts in
      # ~107 ms instead of 6 — it works, so nothing complains, and the only
      # symptom is a hotkey that feels sluggish on every single press.
      - name: Publish vst-ctl (NativeAOT)
        run: dotnet publish src/VibeSuperTonic.Ctl/VibeSuperTonic.Ctl.csproj -c Release -r linux-x64 -o out/ctl --nologo

      - name: Assert the shipped client is a native binary
        run: |
          if [ ! -f out/ctl/vst-ctl ]; then
            echo "no vst-ctl in the publish output:"; ls -la out/ctl; exit 1
          fi
          if [ -f out/ctl/vst-ctl.dll ]; then
            echo "vst-ctl.dll is present, so this is a managed publish, not an AOT one."
            echo "The client would start in ~107 ms instead of 6 — most of the"
            echo "acknowledgement budget, spent before any work begins."
            exit 1
          fi
          file out/ctl/vst-ctl | grep -q 'ELF 64-bit.*executable' || {
            echo "vst-ctl is not a native ELF executable:"; file out/ctl/vst-ctl; exit 1
          }
          echo "OK: $(file -b out/ctl/vst-ctl | cut -d, -f1-2), $(du -h out/ctl/vst-ctl | cut -f1)"

  # ------------------------------------------------------------------- pack
  #
  # WHY THIS JOB EXISTS. build/pack-tar.sh carries nine assertions, and until
  # this job they ran ONLY on the machine that packed a release, only when a
  # human ran the packer. Every one of them guards a failure that is silent — a
  # stale binary, a managed apphost, 330 MB of CUDA provider, a missing espeak
  # dictionary that makes a voice produce no sound while exiting 0. A green
  # `build` job said nothing about any of them.
  #
  # It is also the only job that builds espeak-ng, so P5's payload is otherwise
  # unverified between releases.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # The pin is a fixed commit, so the key is exact: the payload rebuilds only
      # when the pin moves. piper-voices.json and P1's corpus are in the key too
      # because they DECIDE WHICH DICTIONARIES the payload contains — a catalog
      # that gained a language against a cached payload would fail the packer's
      # behavioural check, which is the right outcome but a confusing way to
      # learn it.
      - name: Cache the espeak-ng payload
        id: espeak-cache
        uses: actions/cache@v4
        with:
          path: |
            build/espeak-out/espeak
            build/espeak-out/install
          key: espeak-${{ runner.os }}-${{ hashFiles('build/build-espeak.sh', 'piper-voices.json', 'spike/piper-phonemes/corpus.json') }}

      - name: Build espeak-ng
        if: steps.espeak-cache.outputs.cache-hit != 'true'
        run: bash build/build-espeak.sh

      # No -v: the default is <VstVersion> from Directory.Build.props, which is
      # what assertion 1 checks the binaries against. Passing a version here
      # would test the flag rather than the agreement.
      - name: Pack the Linux tarball, with its nine assertions
        run: bash build/pack-tar.sh

      # The script travels WITH the tarball rather than being checked out in the
      # smoke job: that job runs in a bare ubuntu:22.04 container, which has no
      # git, and actions/checkout without git falls back to a REST download —
      # one more thing to fail for a reason unrelated to the archive.
      - name: Upload the tarball and its smoke test
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: |
            dist/*.tar.gz
            build/smoke-test.sh
          retention-days: 7

  # ------------------------------------------------------------------ smoke
  #
  # DOES THE ARCHIVE OPEN SOMEWHERE ELSE. Every check above runs on a machine
  # with the .NET SDK, a display, ICU, espeak-ng and every build dependency the
  # product does not ship. The glibc-floor assertion measures ELF symbol
  # versions and concludes "Ubuntu 22.04+"; this job is that claim's experiment,
  # run on the oldest distro the floor says is supported.
  #
  # ubuntu:22.04 bare, with nothing installed into it beyond what tar needs.
  smoke:
    runs-on: ubuntu-latest
    needs: pack
    container: ubuntu:22.04
    steps:
      - name: Download the tarball and its smoke test
        uses: actions/download-artifact@v4
        with:
          name: linux-tarball

      # NOTHING IS INSTALLED INTO THIS CONTAINER. That is the experiment: the
      # product claims to bring its own runtime, and ubuntu:22.04 is the oldest
      # distro the glibc floor says is supported. If this job ever needs libicu,
      # openssl or libespeak-ng added to it, that is a FINDING ABOUT THE ARCHIVE
      # and belongs in INSTALL.txt — it is not a fix to this file.
      - name: Extract
        run: |
          mkdir -p /tmp/release
          tar -xzf dist/VibeSuperTonic-*.tar.gz -C /tmp/release
          ls -la /tmp/release/VibeSuperTonic | head

      # NO BASHISMS IN THIS JOB. A container job runs its steps with `sh -e`, not
      # `bash -e` — so `set -o pipefail` here failed with "Illegal option" under
      # dash before the script was ever reached. Redirect and re-read rather than
      # pipe through tee: it needs no pipefail, and it does not assume the shell
      # wrapping the step is the same one that runs the script.
      - name: Smoke test
        run: |
          if bash build/smoke-test.sh /tmp/release/VibeSuperTonic > /tmp/smoke.log 2>&1; then
            cat /tmp/smoke.log
          else
            cat /tmp/smoke.log
            exit 1
          fi

      # Same reasoning as the linux job's: the smoke script says exactly which
      # check failed and why, and that text is unreadable without admin rights
      # unless it is put in the step summary.
      - name: What the smoke test said
        if: failure()
        run: |
          echo '## Smoke test failed' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 /tmp/smoke.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || \
            echo '(no output captured)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
